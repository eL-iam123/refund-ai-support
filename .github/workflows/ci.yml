name: CI

# The whole guarantee of this repository is that a policy engine, not a model,
# decides refunds - and that claim is only worth anything if the suite that
# checks it runs on every change. `pnpm verify` is typecheck, lint and the tests
# (API and storefront); this exists so it is never only ever run by hand.

on:
  push:
    branches: [master, main]
  pull_request:

# A new push to the same branch makes the previous run's answer irrelevant.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: typecheck, lint, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Pinned to the version this repository is developed and built with, rather
      # than to a major. It had drifted: CI installed pnpm 10 while every other
      # surface used 12, and a lockfile is only guaranteed installable with
      # --frozen-lockfile by the pnpm that wrote it. Pinning the exact version is the
      # fix; bumping it is a deliberate change, not an accident.
      - uses: pnpm/action-setup@v4
        with:
          version: 12.8.1

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # No API key and no .env are provided, deliberately. The suite is written to
      # run without credentials - model calls are faked in tests, and the
      # configuration tests drive process.env directly - so a green run here is
      # evidence that a fresh clone works, which is the thing a reviewer does.
      - name: Verify (typecheck, lint, tests)
        run: pnpm verify

      # The image builds both applications, so CI builds them too. Without this a
      # bundling or emit failure would first be discovered by a deploy, which is the
      # worst place to find out that the thing nobody ran by hand also does not build.
      - name: Build
        run: pnpm build
