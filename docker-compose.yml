# Single-container deployment: API, staff console and storefront in one image.
#
# The three are one origin on purpose, so the storefront's session cookie is
# first-party. Scaling out is a question for later, but a second replica pointed
# at the same SQLite volume is not a valid scale-out - the audit chain is
# sequential by id, and two writers would both believe they held the head.

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: refund-assistant:latest
    restart: unless-stopped
    ports:
      - "${API_BIND:-127.0.0.1}:${API_PORT_EXTERNAL:-4000}:4000"
    environment:
      # Defaults to development so `docker compose up` runs as a single command.
      # Setting this to production turns on the stricter boot checks, which
      # refuse a published demo password and require a real model - that is the
      # point: claiming to be a deployment means supplying a deployment's
      # secrets.
      NODE_ENV: ${NODE_ENV:-development}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      DATABASE_PATH: /data/refund.sqlite
      # Same-origin: the API is the only origin, so CORS is only needed for the
      # Vite dev servers. Empty in production is correct, not an oversight.
      CORS_ORIGIN: ${CORS_ORIGIN:-}
      # AI_API_KEY is the only thing that has to be set to use a model. The
      # provider is worked out from the key, so any provider's key works here
      # unchanged. AI_PROVIDER is for the case where the key is not one of the
      # shapes it recognises - a compatible endpoint of your own.
      AI_API_KEY: ${AI_API_KEY:-}
      AI_PROVIDER: ${AI_PROVIDER:-}
      # Unset means "required in production, tolerated in development", so a
      # reviewer who clones this and runs `docker compose up` gets a working
      # product without credentials, and a deployment that has to be the model
      # cannot start without one. Set to true to demand a key here too.
      AI_REQUIRED: ${AI_REQUIRED:-}
      AI_MODEL: ${AI_MODEL:-}
      AI_FALLBACK_MODELS: ${AI_FALLBACK_MODELS:-}
      AI_BASE_URL: ${AI_BASE_URL:-}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      NVIDIA_API_KEY: ${NVIDIA_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      # The staff console exists only once a username and a password are set.
      # Both default to empty, which is the point: a clone that runs
      # `docker compose up` has no admin surface at all, and every staff route
      # answers 404 until an operator account is configured. admin-login.txt has
      # the demo pair, and the API refuses that exact password in production.
      ADMIN_USERNAME: ${ADMIN_USERNAME:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      # Optional. The key staff sessions are signed with; it is derived from
      # ADMIN_PASSWORD when unset. Setting it separately means rotating one value
      # invalidates every outstanding session at once.
      ADMIN_API_SECRET: ${ADMIN_API_SECRET:-}
    volumes:
      - refund-data:/data
    # The SQLite file is the only durable state, so a lost container is not a
    # lost product - but losing it would lose every audit record, which is the
    # thing the whole system exists to produce.
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    # A refund API that will happily process unbounded traffic is not a
    # protection, it is a queue with no limit. The application rate-limits too;
    # this is the outer wall.
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 1G

volumes:
  refund-data:
